# Environment settings for DEV. One file per environment (dev.yaml, qa.yaml, prod.yaml).
# Passwords are NEVER stored here: only the NAMES of the environment variables that hold them.
aws:
  region: us-east-1
  bucket: vision-mkt-raw-dev          # e.g. vision1402-mkt-raw-dev  (CHANGE THIS)
oracle:
  dsn: oracle-legacy:1521/FREEPDB1    # host:port/service, as seen from the edge node
  user_env: ORACLE_USER               # set in ~/.dif_env
  password_env: ORACLE_PASSWORD       # set in ~/.dif_env
control_prefix: _control              # watermarks + audit records live here
